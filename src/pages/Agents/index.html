<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recordful</title>
    <style>
      @font-face {
        font-family: Satoshi-Medium;
        src: url(chrome-extension://__MSG_@@extension_id__/assets/fonts/Satoshi-Medium.ttf) format("truetype");
      }
      @font-face {
        font-family: Satoshi-Bold;
        src: url(chrome-extension://__MSG_@@extension_id__/assets/fonts/Satoshi-Bold.ttf) format("truetype");
      }

      :root {
        --bg: #f6f6f8;
        --card: #ffffff;
        --text: #16161d;
        --muted: #63636e;
        --border: #e6e6ec;
        --accent: #4f46e5;
        --accent-text: #ffffff;
        --accent-soft: #eef0ff;
        --ok: #16a34a;
        --warn: #d97706;
        --code-bg: #f1f1f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111116;
          --card: #1a1a21;
          --text: #f2f2f6;
          --muted: #a0a0ad;
          --border: #2c2c36;
          --accent: #818cf8;
          --accent-text: #111116;
          --accent-soft: #23243a;
          --ok: #4ade80;
          --warn: #fbbf24;
          --code-bg: #24242d;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body {
        font-family: Satoshi-Medium, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        padding: 40px 16px;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1, h2 { font-family: Satoshi-Bold, system-ui, sans-serif; margin: 0; }
      h1 { font-size: 26px; letter-spacing: -0.01em; }
      h2 { font-size: 15px; margin-bottom: 10px; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-top: 16px;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .intro { margin-top: 8px; }

      .switch { position: relative; width: 44px; height: 26px; flex: none; }
      .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
      .switch span {
        position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background 0.15s;
      }
      .switch span::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
        background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .switch input:checked + span { background: var(--accent); }
      .switch input:checked + span::after { transform: translateX(18px); }
      .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

      .status { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
      .dot[data-state="connected"] { background: var(--ok); }
      .dot[data-state="pairing"], .dot[data-state="connecting"] { background: var(--warn); }
      .dot[data-state="idle"] { background: var(--accent); }

      .code-line {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        background: var(--code-bg); border-radius: 10px; padding: 10px 12px; margin: 12px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px;
        overflow-x: auto;
      }
      button {
        font: inherit; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--border);
        background: var(--card); color: var(--text);
      }
      button:hover { border-color: var(--muted); }
      button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      button.small { padding: 4px 10px; font-size: 13px; }
      a { color: var(--accent); }

      ul.pairings { list-style: none; padding: 0; margin: 0; }
      ul.pairings li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
      ul.pairings li + li { border-top: 1px solid var(--border); }

      /* pairing window */
      body.pair { padding: 28px 20px; }
      .pair-code {
        font-family: Satoshi-Bold, ui-monospace, monospace; font-size: 44px; letter-spacing: 0.3em;
        text-align: center; background: var(--accent-soft); color: var(--accent); border-radius: 14px;
        padding: 14px 0 14px 0.3em; margin: 20px 0;
      }
      .actions { display: flex; gap: 10px; margin-top: 8px; }
      .actions button { flex: 1; padding: 11px 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="manage" hidden>
      <h1 data-i18n="agentsPageTitle"></h1>
      <p class="intro muted" data-i18n="agentsIntro"></p>

      <section class="card">
        <div class="row">
          <label for="enabled" data-i18n="agentsToggleLabel"></label>
          <span class="switch"><input id="enabled" type="checkbox" role="switch" /><span></span></span>
        </div>
        <p class="status"><span class="dot" id="status-dot"></span><span id="status-text"></span></p>
      </section>

      <section class="card">
        <h2 data-i18n="agentsSetupTitle"></h2>
        <p class="muted" data-i18n="agentsSetupHint"></p>
        <div class="code-line"><code id="setup-command">npx -y recordful-mcp</code><button class="small" id="copy" type="button"></button></div>
        <p><a id="setup-link" href="https://github.com/iKislay/recordful-mcp#install" target="_blank" rel="noopener noreferrer" data-i18n="agentsSetupLink"></a></p>
      </section>

      <section class="card">
        <h2 data-i18n="agentsPairedTitle"></h2>
        <ul class="pairings" id="pairings"></ul>
        <p class="muted" id="pairings-empty" data-i18n="agentsPairedEmpty"></p>
      </section>
    </main>

    <main id="pair" hidden>
      <h1 id="pair-title"></h1>
      <p class="intro muted" id="pair-body"></p>
      <div class="pair-code" id="pair-code" aria-live="polite"></div>
      <div class="actions">
        <button type="button" id="deny" data-i18n="agentsPairDeny"></button>
        <button type="button" class="primary" id="allow" data-i18n="agentsPairAllow"></button>
      </div>
      <p class="muted" id="pair-expired" data-i18n="agentsPairExpired" hidden></p>
    </main>
  </body>
</html>
